version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/keygate.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: keygate

build:
  run_buildscript: false

images:
  # 版本源镜像：纯 SemVer tag（当前 0.1.13），lazycat 交付（官方商店要求）
  - id: keygate
    target: service
    service: keygate
    source: ghcr.io/tabloy/keygate
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
  # 数据库镜像：18.x-alpine 家族（custom 通道映射 SemVer）
  - id: postgres
    target: service
    service: postgres
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^18\.\d+-alpine$'
    version_regex: '^(?P<version>18\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
    create_if_missing: true
    application:
      language: zh
      name: Keygate
      brief: 开源自托管软件许可证管理平台
      description: |
        自托管的软件许可证管理平台：激活码、许可证签发、客户管理、Stripe 计费、
        发布分发（Sparkle / Velopack / Tauri 更新源）一站式管理，替代 Keygen、
        Cryptlex 等按席位收费的商业平台。
      keywords: license, keygen, licensing, activation, software, stripe
      source: https://github.com/tabloy/keygate
      source_author: tabloy
      support_pc: true
      support_mobile: true
      screenshot_pc_files:
        - .github/screenshots/pc-1-dashboard.png
        - .github/screenshots/pc-2-licenses.png
        - .github/screenshots/pc-3-products.png
        - .github/screenshots/pc-4-settings.png
      screenshot_mobile_files:
        - .github/screenshots/mobile-1-dashboard.png
        - .github/screenshots/mobile-2-licenses.png
        - .github/screenshots/mobile-3-products.png
        - .github/screenshots/mobile-4-customers.png
        - .github/screenshots/mobile-5-settings.png
  private:
    enabled: true
    skip_if_version_exists: true
    name: Keygate
    summary: 开源自托管软件许可证管理平台：激活、签发、计费与分发
