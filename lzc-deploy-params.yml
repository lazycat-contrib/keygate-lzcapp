params:
  - id: admin_email
    type: string
    name: "Admin Email"
    description: "Admin account email (optional; leave empty to create the owner account through the in-app setup page)"
    default_value: ""
    optional: true
  - id: smtp_host
    type: string
    name: "SMTP Host"
    description: "SMTP server for OTP emails (optional; when unset the OTP code is printed to the application log)"
    default_value: ""
    optional: true
  - id: smtp_port
    type: string
    name: "SMTP Port"
    description: "SMTP port (default 587)"
    default_value: "587"
    optional: true
  - id: smtp_username
    type: string
    name: "SMTP Username"
    description: "SMTP username (optional)"
    default_value: ""
    optional: true
  - id: smtp_password
    type: secret
    name: "SMTP Password"
    description: "SMTP password (optional)"
    default_value: ""
    optional: true
  - id: smtp_from
    type: string
    name: "SMTP From"
    description: "From address for OTP emails (optional, defaults to the SMTP username)"
    default_value: ""
    optional: true
  - id: stripe_secret_key
    type: secret
    name: "Stripe Secret Key"
    description: "Stripe secret key for billing checkout (optional)"
    default_value: ""
    optional: true
  - id: stripe_webhook_secret
    type: secret
    name: "Stripe Webhook Secret"
    description: "Stripe webhook signing secret (optional)"
    default_value: ""
    optional: true
  - id: redis_url
    type: string
    name: "Redis URL"
    description: "Redis connection URL for rate limiting and caching (optional)"
    default_value: ""
    optional: true
  - id: storage_bucket
    type: string
    name: "Storage Bucket"
    description: "S3-compatible bucket for release distribution (optional; set all STORAGE_* together to enable)"
    default_value: ""
    optional: true
  - id: storage_endpoint
    type: string
    name: "Storage Endpoint"
    description: "S3-compatible endpoint URL (optional)"
    default_value: ""
    optional: true
  - id: storage_region
    type: string
    name: "Storage Region"
    description: "S3 region (default auto)"
    default_value: "auto"
    optional: true
  - id: storage_access_key
    type: string
    name: "Storage Access Key"
    description: "S3 access key ID (optional)"
    default_value: ""
    optional: true
  - id: storage_secret_key
    type: secret
    name: "Storage Secret Key"
    description: "S3 secret access key (optional)"
    default_value: ""
    optional: true
  - id: storage_public_url
    type: string
    name: "Storage Public URL"
    description: "Public base URL for release downloads (optional)"
    default_value: ""
    optional: true

locales:
